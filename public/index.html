<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scraper Mercado Libre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Buscador de Mercado Libre</h1>

        <div class="tabs">
            <button class="tab-btn active" data-tab="search">Buscar artículo</button>
            <button class="tab-btn" data-tab="seller">Catálogo de vendedor</button>
        </div>

        <div id="tab-search" class="tab-pane">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Ingresa una palabra clave ej: auriculares">
                <button id="searchBtn">Buscar</button>
            </div>
        </div>

        <div id="tab-seller" class="tab-pane hidden">
            <div class="search-container">
                <input type="text" id="sellerUrlInput" placeholder="ej: https://www.mercadolibre.com.ar/pagina/hermanrepuestos">
                <button id="loadSellerBtn">Cargar vendedor</button>
            </div>
        </div>
    </header>

    <main>
        <!-- Filtro de precio (modo búsqueda) -->
        <div id="price-filter" class="price-filter hidden">
            <span class="filter-label">Filtrar por precio:</span>
            <div class="filter-inputs">
                <input type="number" id="minPrice" placeholder="Mínimo $" min="0">
                <span class="filter-sep">—</span>
                <input type="number" id="maxPrice" placeholder="Máximo $" min="0">
            </div>
            <span id="filterCount" class="filter-count"></span>
        </div>

        <!-- Panel de vendedor (modo catálogo) -->
        <div id="seller-panel" class="seller-panel hidden">
            <div class="seller-panel__header">
                <div>
                    <div class="seller-panel__name" id="sellerName"></div>
                    <div class="seller-panel__meta" id="sellerMeta"></div>
                </div>
                <div class="seller-panel__sort">
                    <label for="sortSelect">Ordenar:</label>
                    <select id="sortSelect">
                        <option value="SELLER_RANKING">Más vendidos</option>
                        <option value="PRICE_ASC">Menor precio</option>
                        <option value="PRICE_DESC">Mayor precio</option>
                    </select>
                </div>
            </div>
            <div class="seller-panel__categories">
                <button class="category-btn active" data-url="" data-name="Todos los productos">Todos los productos</button>
                <div id="categoryList" class="category-list"></div>
            </div>
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p id="loadingText">Cargando...</p>
        </div>
        <div id="error" class="error-msg hidden"></div>

        <!-- Paginación (modo catálogo) -->
        <div id="pagination" class="pagination hidden">
            <button id="prevPage" disabled>← Anterior</button>
            <span id="pageInfo"></span>
            <button id="nextPage">Siguiente →</button>
        </div>

        <div class="table-container">
            <table class="results-table">
                <thead>
                    <tr>
                        <th>Miniatura</th>
                        <th>Producto</th>
                        <th id="thPrecio" class="sortable" title="Ordenar por precio">Precio <span id="sortIndicator"></span></th>
                        <th id="thCol4">Financiación</th>
                        <th>Logística</th>
                        <th id="thCol6">Vendedor</th>
                        <th id="thCol7">Stock / Destacado</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                </tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
